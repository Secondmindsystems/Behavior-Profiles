name: Validate Behavior Profiles package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package structure
        run: python -B tools/verify_profile_package.py --mode package
      - name: Verify release evidence
        run: python -B tools/verify_profile_package.py --mode release
      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Run harness tests
        run: python -B -m unittest discover -s harness/tests -p "test_*.py"
      - name: Verify frozen publication identities
        run: python -B tools/check_scope_control_publication_state.py --source-file scope-control/BEHAVIOR_PROFILE_SCOPE_CONTROL.md
      - name: Verify paired control discrimination
        run: >-
          python -B harness/harness.py run-controls
          --suite harness/profiles/scope-control/suite.json
          --observations harness/profiles/scope-control/controls.json
          --profile scope-control/BEHAVIOR_PROFILE_SCOPE_CONTROL.md
      - name: Verify Runtime proof-only boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path("products/behavior-profiles/PUBLIC_RUNTIME_QUALIFICATION_MANIFEST_v0_1.json")
          old_manifest = Path("products/behavior-profiles/PUBLIC_RUNTIME_PROJECTION_MANIFEST_v0_1.json")
          runtime_readme = "products/behavior-profiles/runtime/README.md"
          canonical_sha = "769385360202ad58557d52ab1d3b9e1d3419a056b50f513af66d3604dab0e1d6"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["schema_version"] == "1.0"
          assert manifest["campaign_id"] == "BP-SCOPE-CONTROL-RUNTIME-001"
          assert manifest["artifact_class"] == "PUBLIC_QUALIFICATION_PROOF"
          assert manifest["public_runtime_source_distributed_at_head"] is False
          assert manifest["history_rewritten"] is False
          assert manifest["canonical_constitution_sha256"] == canonical_sha
          assert manifest["qualification_results"]["internal_runtime_tests"] == "25/25 PASS"
          assert manifest["qualification_results"]["paired_engine_matrix"] == "16/16 PASS"
          assert manifest["qualification_results"]["ask_engine"] == "QUALIFIED"
          assert manifest["qualification_results"]["ask_live_host"] == "UNPROVEN"
          assert manifest["qualification_results"]["ask_host_obedience"] == "UNPROVEN"
          assert set(manifest["limitations"]) == {
              "LIM-1", "LIM-2", "LIM-3", "LIM-4", "LIM-5",
              "LIM-6", "LIM-7", "LIM-8a", "LIM-8b", "LIM-8c",
          }
          assert manifest["active_distribution_boundary"]["runtime_directory_tracked_files"] == [runtime_readme]
          assert manifest["active_distribution_boundary"]["implementation_distributed"] is False
          assert not old_manifest.exists()

          actual_runtime = subprocess.check_output(
              ["git", "ls-files", "--", "products/behavior-profiles/runtime"],
              text=True,
          ).splitlines()
          assert actual_runtime == [runtime_readme], f"unexpected Runtime mechanism at HEAD: {actual_runtime}"

          constitutions = [
              Path("scope-control/BEHAVIOR_PROFILE_SCOPE_CONTROL.md"),
              Path("products/behavior-profiles/scope-control/BEHAVIOR_PROFILE_SCOPE_CONTROL.md"),
          ]
          hashes = [hashlib.sha256(path.read_bytes()).hexdigest() for path in constitutions]
          assert hashes == [canonical_sha, canonical_sha], f"constitution drift: {hashes}"

          print("Runtime public boundary: proof and architecture only")
          print("Tracked Runtime mechanism files: 0")
          print("Qualification identities and limitations: PASS")
          print("ASK boundary: engine qualified / live host unproven")
          print("Dual constitutions: canonical and byte-identical")
          PY
